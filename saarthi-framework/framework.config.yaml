# framework.config.yaml
# Machine-readable control plane for the AI Agent Framework.
#
# This file is the SINGLE SOURCE OF TRUTH for:
#   - host coding agent identity and compatibility (agent_context)
#   - workflow mode -> leads -> artifacts -> question budget
#   - model tier -> model selection policy
#   - per-mode token/cost budgets and stop-and-report thresholds
#   - machine-checkable Definition of Done (DoD)
#   - how verification commands are discovered and cached (not hard-coded)
#
# The markdown docs under _framework/ explain the intent in human language.
# When prose and this file disagree, THIS FILE WINS.
#
# How to adopt in a new repository:
#   1. Set `agent_context.active_agent` to your coding tool's key
#      (github_copilot | claude_code | cursor | windsurf | cline | continue |
#       antigravity | generic). See SETUP-CHECKLIST.txt for step-by-step guide.
#   2. (Optional) Set `models.tier_map` hints, or leave `models.selection: auto`
#      to let the orchestrator pick the appropriate model per tier.
#   3. Do NOT hard-code build/test commands. They are auto-discovered once per
#      work item and cached in work-items/<ID>/verification-commands.yaml.
#   4. Adjust `definition_of_done.*` thresholds to your standards.
#   5. Everything else can stay as shipped defaults.

version: "0.5.0"

# ---------------------------------------------------------------------------
# Agent Context (Coding-Agent Awareness)
# Identifies which coding agent/tool hosts this framework instance.
# The orchestrator uses this to qualify tool discovery searches and filter
# recommendations to those compatible with the host agent.
#
# How to set at installation time:
#   Set `agent_context.active_agent` to the key matching your coding tool.
#   If left as "generic", the framework will ask once on first use.
# ---------------------------------------------------------------------------
agent_context:
  # The coding agent hosting this framework instance.
  # Valid values: github_copilot | claude_code | cursor | windsurf | cline |
  #               continue | antigravity | generic
  # "generic" means unknown/not yet set — triggers a one-time detection prompt.
  active_agent: "generic"

  # When true, all tool/skill discovery searches are qualified with the active
  # agent name (e.g., "persistent memory MCP for GitHub Copilot" instead of
  # "persistent memory MCP"). Set to false to disable agent-qualified searches.
  agent_aware_search: true

  # Catalog of known host agents with their traits.
  # Used to qualify searches, filter incompatible tools, and generate the
  # correct installation config blocks in 17-mcp-tool-discovery.md.
  known_agents:
    github_copilot:
      display_name: "GitHub Copilot (VS Code)"
      mcp_config_files:
        - ".vscode/mcp.json"
        - "settings.json (mcpServers block)"
      native_skills:
        - "VS Code extensions"
        - "GitHub Copilot Extensions"
        - "@workspace context"
      preferred_tool_sources:
        - "VS Code Marketplace"
        - "GitHub Copilot Extensions marketplace"
        - "modelcontextprotocol.io/servers"
      incompatible_with:
        - "claude-mem"           # Requires Claude Code memory subsystem
        - "claude_code_memory"   # Claude Code native memory
      search_qualifier: "GitHub Copilot VS Code"

    claude_code:
      display_name: "Claude Code (CLI)"
      mcp_config_files:
        - "~/.config/claude/mcp.json"
        - ".mcp.json (project root)"
      native_skills:
        - "claude-mem (persistent memory)"
        - "CLAUDE.md context"
        - "Native MCP via ~/.config/claude/"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "github.com/modelcontextprotocol/servers"
        - "Anthropic official MCP packages"
      incompatible_with: []
      search_qualifier: "Claude Code Anthropic"

    cursor:
      display_name: "Cursor"
      mcp_config_files:
        - "~/.cursor/mcp.json"
        - ".cursor/mcp.json (project)"
      native_skills:
        - ".cursorrules context"
        - "Cursor Composer"
        - "Cursor extensions"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "github.com/modelcontextprotocol/servers"
        - "Cursor Extensions directory"
      incompatible_with:
        - "claude-mem"
        - "claude_code_memory"
      search_qualifier: "Cursor AI editor"

    windsurf:
      display_name: "Windsurf (Codeium)"
      mcp_config_files:
        - "~/.windsurf/mcp.json"
        - ".windsurf/mcp.json (project)"
      native_skills:
        - "Windsurf Flows"
        - "Cascade context"
        - "Codeium extensions"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "Codeium plugin directory"
      incompatible_with:
        - "claude-mem"
        - "claude_code_memory"
      search_qualifier: "Windsurf Codeium"

    cline:
      display_name: "Cline (VS Code extension)"
      mcp_config_files:
        - "VS Code settings / Cline MCP settings panel"
      native_skills:
        - "VS Code extensions"
        - "Cline tool use"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "VS Code Marketplace"
      incompatible_with:
        - "claude-mem"
        - "claude_code_memory"
      search_qualifier: "Cline VS Code"

    continue:
      display_name: "Continue (VS Code / JetBrains)"
      mcp_config_files:
        - "~/.continue/config.json"
      native_skills:
        - "Continue context providers"
        - "VS Code / JetBrains extensions"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "Continue Hub"
      incompatible_with:
        - "claude-mem"
        - "claude_code_memory"
      search_qualifier: "Continue dev extension"

    antigravity:
      display_name: "Antigravity / Antigravity CLI"
      mcp_config_files:
        - "workspace AGENTS.md or CLI flags"
      native_skills:
        - "Antigravity sub-agents"
        - "AGENTS.md-driven context"
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
      incompatible_with:
        - "claude-mem"
        - "claude_code_memory"
      search_qualifier: "Antigravity AI agent"

    generic:
      display_name: "Generic / Unknown"
      mcp_config_files: []
      native_skills: []
      preferred_tool_sources:
        - "modelcontextprotocol.io/servers"
        - "github.com/modelcontextprotocol/servers"
        - "mcp.so"
      incompatible_with: []
      search_qualifier: ""   # No qualifier — broad search

# ---------------------------------------------------------------------------
# Environment Profiles (Resource Awareness)
# Orchestrator adapts parallelism and context bounds based on the active profile.
# ---------------------------------------------------------------------------
environment_profiles:
  active: "cloud" # Change to local_small, local_large, etc., based on environment
  profiles:
    cloud:
      description: "Cloud-hosted large models (e.g. GPT-4o, Claude 3.5 Sonnet)"
      max_parallel_agents: 5
      context_strategy: "full_history"
      preferred_orchestration_level: "full"
    cloud_balanced:
      description: "Cloud-hosted models with moderate context/cost discipline"
      max_parallel_agents: 3
      context_strategy: "summarized_history"
      preferred_orchestration_level: "balanced"
    local_large:
      description: "Local 14B-70B models"
      max_parallel_agents: 2
      context_strategy: "summarized_history"
      preferred_orchestration_level: "balanced"
    local_medium:
      description: "Local 8B-14B models"
      max_parallel_agents: 1
      context_strategy: "contract_first"
      preferred_orchestration_level: "lean"
    local_small:
      description: "Local 4B-8B models (e.g. Gemma 4B)"
      max_parallel_agents: 1
      context_strategy: "distilled_only" # Routes to 00a-distilled-entry-prompt.txt
      preferred_orchestration_level: "minimal"

# ---------------------------------------------------------------------------
# Orchestration Levels & Capability Probe
# Defines how much ceremony, parallelism, and context breadth Saarthi should use
# after considering the environment profile and the loaded model's observed
# capabilities. This lets the framework degrade gracefully instead of making a
# binary jump between "full orchestration" and "distilled only".
# ---------------------------------------------------------------------------
orchestration:
  default_level: "balanced"
  fallback_order:
    - "balanced"
    - "lean"
    - "minimal"
  levels:
    full:
      description: "Full ceremony, parallel sub-agents when supported, full-history context."
      allows_parallel_sub_agents: true
      requires_contracts_for_parallel_work: true
      context_strategy: "full_history"
      question_style: "full_p0_p1_p2"
    balanced:
      description: "Normal default for capable models; use summaries first and parallelize only where the contract is clear."
      allows_parallel_sub_agents: true
      requires_contracts_for_parallel_work: true
      context_strategy: "summarized_history"
      question_style: "grouped_p0_p1_p2"
    lean:
      description: "Sequential or pseudo-parallel execution with strict context trimming and fewer concurrent responsibilities."
      allows_parallel_sub_agents: false
      requires_contracts_for_parallel_work: true
      context_strategy: "contract_first"
      question_style: "p0_first_then_p1"
    minimal:
      description: "Distilled mode for weak/local models; no parallelism, no optional ceremony, only essential gates."
      allows_parallel_sub_agents: false
      requires_contracts_for_parallel_work: false
      context_strategy: "distilled_only"
      question_style: "p0_only_unless_safe"
  capability_probe:
    enabled: true
    probe_dimensions:
      structured_output: 20
      multi_step_follow_through: 20
      tool_recall: 15
      verification_discipline: 15
      context_retention: 15
      parallel_coordination: 15
    thresholds:
      full: 85
      balanced: 65
      lean: 45
      minimal: 0
    degrade_signals:
      - "Drops required response sections twice in the same work item."
      - "Loses track of the active artifact or verification command cache."
      - "Fails to preserve sub-task contracts or handoff boundaries."
      - "Needs repeated re-asking for the same context because recall is weak."
    escalate_signals:
      - "Sustains structured outputs across multiple turns without drift."
      - "Executes verification loops correctly without skipping evidence."
      - "Can reason over summaries/contracts without reloading full history."
      - "Handles sequential decomposition cleanly even when parallel spawn is unavailable."

# ---------------------------------------------------------------------------
# MCP Servers & Capabilities (Tool Integration)
# Define expected tools. The framework will instruct agents to use these natively.
# If a tool is missing, the agent will research and recommend the best MCP to
# fill the gap (see _framework/17-mcp-tool-discovery.md).
# Always guide users to configure credentials via their environment/secret manager
# (never paste tokens into chat).
# Users can manually add any custom MCP here to grant roles new powers.
# ---------------------------------------------------------------------------
mcp_servers:
  self_onboarding_enabled: true
  # When a capability gap is detected, search these registries in order:
  discovery_registries:
    - "https://modelcontextprotocol.io/servers"
    - "https://github.com/modelcontextprotocol/servers"
    - "https://mcp.so"
  # Prefer official vendor servers over community alternatives.
  prefer_official: true
  # Always present a confirmation prompt before installing any MCP server.
  require_user_confirmation_before_install: true
  servers:
    github:
      expected_capabilities: ["read_pr", "create_issue", "github_actions_status"]
      roles: ["dev_lead", "devops_lead"]
      package: "@modelcontextprotocol/server-github"
    jira:
      expected_capabilities: ["fetch_ticket", "update_status"]
      roles: ["product_lead"]
    sentry:
      expected_capabilities: ["fetch_errors"]
      roles: ["observability_lead"]

# ---------------------------------------------------------------------------
# Adaptive Learning & Self-Evolution
# Controls how the framework learns from user interactions over time.
# Full policy: _framework/16-adaptive-learning.md
# ---------------------------------------------------------------------------
adaptive_learning:
  enabled: true
  # Minimum number of consistent observations before promoting confidence.
  confidence_thresholds:
    low_to_medium: 2   # observations needed to move from low -> medium
    medium_to_high: 3  # observations needed to move from medium -> high
  # How long (days) before an unobserved preference is flagged for review.
  preference_decay_days: 90
  # Categories that may NEVER be applied without explicit user confirmation,
  # regardless of confidence level (mapped to criticality: high).
  always_confirm_categories:
    - security
    - authentication
    - authorization
    - data-schema
    - infrastructure
    - ci-cd
  # At finalization, automatically check for new preference candidates.
  auto_extract_at_finalization: true
  # Surface medium-confidence preferences as pre-selected P2 defaults at intake.
  surface_as_defaults_at_intake: true
  runtime_enforcement:
    require_index_lookup_at_intake: true
    revalidate_stale_preferences_at_intake: true
    require_citation_when_applying_preferences: true
    record_contradictions_in_summary: true
    max_silent_applications_per_task: 3

# ---------------------------------------------------------------------------
# Execution modes (how autonomous the agent should be)
# ---------------------------------------------------------------------------
autonomy:
  default_level: "L2"
  levels:
    L1:
      name: "Ask-often"
      description: >
        Confirm before each non-trivial action. Use for unfamiliar repos,
        production-risk work, or when the user explicitly wants tight control.
      confirm_before:
        - any_file_write
        - running_tests
        - any_irreversible_action
    L2:
      name: "Act-and-checkpoint"
      description: >
        Default. Implement and verify autonomously within a single work item;
        pause for confirmation at phase boundaries and before irreversible
        actions. Record assumptions in the decision register.
      confirm_before:
        - irreversible_actions
        - releasing_or_pushing
        - weakening_security_controls
    L3:
      name: "Act-and-report"
      description: >
        Maximum autonomy. Implement, verify, and self-correct end to end;
        report results after the fact. Only stops at hard safety rules and
        budget thresholds. Requires a populated decision register for audit.
      confirm_before:
        - hard_safety_rule_triggers
        - budget_threshold_exceeded

# ---------------------------------------------------------------------------
# Model tiers -> models.
# selection: "auto"  -> the orchestrator picks the appropriate available model
#                       per tier at runtime; tier_map values are treated as
#                       PREFERRED HINTS, not fixed bindings.
# selection: "fixed" -> always use exactly the tier_map values below.
# ---------------------------------------------------------------------------
models:
  selection: "auto"
  tier_map:
    tier_1_light: "gpt-5.4-mini"        # e.g. small/fast model
    tier_2_standard: "claude-haiku-4.5"  # e.g. balanced model
    tier_3_heavy: "claude-sonnet-4.6"
    tier_4_specialist: "claude-opus-4.8"  # e.g. expert-level model
  rules:
    - "Use the cheapest tier that can safely do the job."
    - "Escalate only with a stated reason; de-escalate when the task simplifies."
    - "Heavier tiers for design/review; lighter tiers for repetitive implementation."

# ---------------------------------------------------------------------------
# Workflow modes. Source of truth for leads / artifacts / budgets.
# (02-workflow-modes.md explains these in prose.)
# ---------------------------------------------------------------------------
workflow_modes:
  ephemeral_task:
    risk: trivial
    question_budget: 0
    response_size: compact
    model_tier: tier_1_light
    leads: [master_orchestrator]
    artifacts: [] # Zero ceremony: no folder, no intake, no summary
    dod_profile: light
  micro_task:
    risk: low
    question_budget: 3
    response_size: compact
    model_tier: tier_1_light
    leads: [master_orchestrator, dev_lead, code_reviewer_if_code]
    artifacts: [requirement-intake.md, work-item-summary.md]
    dod_profile: light

  small_task:
    risk: low_medium
    question_budget: 5
    response_size: compact
    model_tier: tier_2_standard
    leads: [master_orchestrator, design_lead_light, dev_lead, qa_lead]
    conditional_leads:
      - { lead: security_lead, when: "access/data/security touched" }
      - { lead: compliance_audit_lead, when: "audit-worthy actions touched" }
    artifacts: [requirement-intake.md, clarification-log.md, implementation-plan.md, test-plan.md, work-item-summary.md]
    dod_profile: standard

  standard_feature:
    risk: medium
    question_budget: 7
    response_size: standard
    model_tier: tier_2_standard
    leads: [master_orchestrator, product_lead, design_lead, dev_lead, qa_lead]
    conditional_leads:
      - { lead: security_lead, when: "security-relevant" }
      - { lead: compliance_audit_lead, when: "audit-relevant" }
      - { lead: observability_lead, when: "production-relevant" }
      - { lead: devops_lead, when: "deployment risk" }
    artifacts: [requirement-intake.md, clarification-log.md, product-spec.md, design-spec.md, implementation-plan.md, test-plan.md, work-item-summary.md]
    dod_profile: standard

  complex_feature:
    risk: high
    question_budget: 12
    response_size: standard
    model_tier: tier_3_heavy
    leads: [master_orchestrator, product_lead, design_lead, dev_lead, qa_lead, security_lead, observability_lead]
    conditional_leads:
      - { lead: compliance_audit_lead, when: "audit/compliance-relevant" }
      - { lead: devops_lead, when: "deployment risk" }
    artifacts: [requirement-intake.md, clarification-log.md, product-spec.md, design-spec.md, implementation-plan.md, test-plan.md, observability-plan.md, work-item-summary.md]
    conditional_artifacts:
      - { artifact: security-review.md, when: "security-relevant" }
      - { artifact: devops-release-plan.md, when: "deployment risk" }
      - { artifact: audit-compliance-review.md, when: "audit/compliance-relevant" }
    dod_profile: strict

  high_risk_enterprise:
    risk: critical
    question_budget: 0   # 0 = no fixed limit; prioritize and group
    response_size: detailed
    model_tier: tier_3_heavy
    review_tier: tier_4_specialist
    leads: [master_orchestrator, product_lead, design_lead, security_lead, compliance_audit_lead, observability_lead, dev_lead, qa_lead]
    conditional_leads:
      - { lead: devops_lead, when: "release/deployment risk" }
    artifacts: [requirement-intake.md, clarification-log.md, product-spec.md, design-spec.md, implementation-plan.md, test-plan.md, security-review.md, audit-compliance-review.md, observability-plan.md, work-item-summary.md]
    conditional_artifacts:
      - { artifact: devops-release-plan.md, when: "release/deployment risk" }
    dod_profile: strict

  prototype:
    risk: explicit_only
    question_budget: 5
    response_size: standard
    model_tier: tier_2_standard
    assumptions_allowed: true
    artifacts: [requirement-intake.md, work-item-summary.md]
    dod_profile: prototype

# ---------------------------------------------------------------------------
# Token / cost budgets per mode, with a stop-and-report threshold.
# Budgets are approximate guidance, not hard accounting. When the running
# estimate crosses `stop_and_report_at`, the agent must pause, summarize
# progress + remaining work + spend, and ask whether to continue.
# ---------------------------------------------------------------------------
budgets:
  unit: "approx_tokens"
  modes:
    # Ephemeral tasks usually finish quickly, but a small budget helps detect
    # runaway clarification loops or repeated prompt rework.
    ephemeral_task:       { soft_cap: 8000,   stop_and_report_at: 16000 }
    micro_task:           { soft_cap: 15000,  stop_and_report_at: 30000 }
    small_task:           { soft_cap: 40000,  stop_and_report_at: 80000 }
    standard_feature:     { soft_cap: 120000, stop_and_report_at: 220000 }
    complex_feature:      { soft_cap: 300000, stop_and_report_at: 500000 }
    high_risk_enterprise: { soft_cap: 500000, stop_and_report_at: 900000 }
    prototype:            { soft_cap: 40000,  stop_and_report_at: 80000 }
  rules:
    - "Prefer summaries and references over re-dumping artifacts."
    - "Load knowledge-base entries via knowledge-base/INDEX.md, not by reading everything."
    - "On crossing stop_and_report_at, pause and ask before continuing."

# ---------------------------------------------------------------------------
# Verification commands are NOT hard-coded here, to keep the framework
# project-agnostic. Instead, the agent DISCOVERS the project's real commands
# ONCE when a work item is first initialized, and CACHES them in the work item
# folder. Later turns READ the cache instead of re-discovering every time.
#
#   cache: work-items/<WORK_ITEM_ID>/verification-commands.yaml
#
# The execution-verification loop (13) and gates (05) consume the cached values.
# ---------------------------------------------------------------------------
verification:
  discovery:
    enabled: true
    run_once_per_work_item: true
    cache_file: "verification-commands.yaml"   # relative to work-items/<WORK_ITEM_ID>/
    confirm_with_user: true   # show discovered commands once for confirmation before caching
    # Where to look for commands, in priority order:
    sources:
      - "package.json scripts (npm / pnpm / yarn)"
      - "Makefile / Taskfile.yml / justfile targets"
      - "pyproject.toml / tox.ini / noxfile.py / setup.cfg (python)"
      - "build.gradle(.kts) / pom.xml (gradle / maven)"
      - "Cargo.toml (rust) / go.mod (go) / *.csproj (dotnet)"
      - "CI config (.github/workflows, azure-pipelines.yml, .gitlab-ci.yml)"
      - "README / CONTRIBUTING build & test sections"
    # Steps to resolve a command for (any left unresolved are 'not-applicable'):
    steps:
      - install
      - build
      - lint
      - typecheck
      - unit_tests
      - integration_tests
      - coverage
      - secret_scan
    on_missing_command: >
      Leave the step empty (treated as not-applicable / skipped). Only ask the
      user for a command if a REQUIRED Definition-of-Done check needs it.
    refresh_when:
      - "User says the build/test tooling changed."
      - "A cached command fails because it no longer exists (not a normal test failure)."
  evidence_required: true   # gates require pasted command output, not self-report
  max_fix_iterations: 5     # act->run->fix loop attempts before escalating to user

# ---------------------------------------------------------------------------
# Machine-checkable Definition of Done, by profile.
# A gate is GREEN only when all required checks for the profile pass with
# evidence. "n/a" commands (empty in verification) are skipped, not failed.
# ---------------------------------------------------------------------------
definition_of_done:
  profiles:
    prototype:
      build_passes: true
      lint_clean: false
      new_tests_required: false
      regression_suite_green: false
      coverage_delta_min_pct: null
      no_new_high_severity_findings: true
      assumptions_documented: true
    light:
      build_passes: true
      lint_clean: true
      new_tests_required: false
      regression_suite_green: true
      coverage_delta_min_pct: null
      no_new_high_severity_findings: true
    standard:
      build_passes: true
      lint_clean: true
      new_tests_required: true
      regression_suite_green: true
      coverage_delta_min_pct: 0     # must not decrease coverage
      no_new_high_severity_findings: true
      self_review_passed: true
    strict:
      build_passes: true
      lint_clean: true
      typecheck_clean: true
      new_tests_required: true
      regression_suite_green: true
      coverage_delta_min_pct: 1     # net-positive coverage on changed scope
      no_new_high_severity_findings: true
      self_review_passed: true
      security_gate_passed: true
      secret_scan_clean: true

# ---------------------------------------------------------------------------
# Hard safety rules. These ALWAYS apply regardless of autonomy level.
# The agent must STOP and get explicit confirmation before any of these.
# ---------------------------------------------------------------------------
safety:
  always_confirm_before:
    - "Deleting files, branches, tables, or data (rm -rf, DROP, git branch -D)."
    - "git push, git push --force, git reset --hard, amending published commits."
    - "Weakening or removing authentication/authorization checks."
    - "Disabling security controls, validation, or safety checks (e.g. --no-verify)."
    - "Modifying shared infrastructure, CI/CD secrets, or production config."
    - "Sending messages, commenting on PRs/issues, or other outbound actions."
  never_without_explicit_flag:
    - "Lowering an existing permission/role requirement."
    - "Logging secrets, tokens, PII, or credentials."
    - "Committing secrets or .env files."
  on_secret_detected: "Stop, do not commit, alert the user, and recommend rotation."
